<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayOut Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #806B40;
            color: #F5F5F5;
            min-height: 100vh;
            padding: 24px;
        }
        h1 { font-size: 28px; font-weight: 900; margin-bottom: 4px; }
        .subtitle { opacity: 0.7; margin-bottom: 24px; font-size: 14px; }
        .stats { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
        .stat { background: #2C332D; border-radius: 8px; padding: 12px 20px; text-align: center; }
        .stat-number { font-size: 24px; font-weight: bold; color: #00AEFF; }
        .stat-label { font-size: 11px; color: #8B949E; }
        .proposals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
        }
        .card { background: #2C332D; border-radius: 12px; overflow: hidden; }
        .card img { width: 100%; height: 200px; object-fit: cover; background: #1C2230; display: block; }
        .photos-scroll {
            display: flex;
            gap: 8px;
            padding: 12px;
            overflow-x: auto;
            background: #1C2230;
        }
        .photo-item {
            position: relative;
            flex-shrink: 0;
            cursor: pointer;
        }
        .photo-item img {
            width: 100px;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            border: 3px solid transparent;
            display: block;
            transition: border-color 0.2s;
        }
        .photo-item.is-main img {
            border-color: #00AEFF;
        }
        .main-badge {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            background: #00AEFF;
            color: white;
            font-size: 9px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            white-space: nowrap;
        }
        .card-body { padding: 16px; }
        .sport-badge {
            display: inline-block; background: #00AEFF; color: white;
            padding: 3px 10px; border-radius: 20px; font-size: 12px;
            font-weight: bold; margin-bottom: 12px;
        }
        .field-group { margin-bottom: 12px; }
        .field-group label { font-size: 11px; color: #8B949E; display: block; margin-bottom: 4px; }
        .field-group input, .field-group textarea, .field-group select {
            width: 100%; background: #1C2230; border: 1px solid #8B949E40;
            border-radius: 6px; color: #F5F5F5; padding: 8px; font-size: 13px;
            font-family: Arial, sans-serif;
        }
        .field-group textarea { resize: vertical; min-height: 80px; }
        .toggle-row { display: flex; gap: 8px; }
        .toggle-btn {
            flex: 1; padding: 8px; border: 2px solid #8B949E40;
            border-radius: 8px; background: transparent; color: #8B949E;
            font-size: 12px; cursor: pointer; transition: all 0.2s;
        }
        .toggle-btn.active { border-color: #00AEFF; color: #00AEFF; background: #00AEFF20; }
        .stars-row { display: flex; gap: 4px; }
        .star-btn {
            font-size: 20px; background: none; border: none;
            cursor: pointer; color: #8B949E; transition: color 0.1s;
            padding: 2px;
        }
        .star-btn.active { color: #00AEFF; }
        .neighbourhood-row { display: flex; gap: 8px; align-items: flex-end; }
        .neighbourhood-row input { flex: 1; }
        .maps-btn {
            padding: 8px 10px; background: #00AEFF; border: none;
            border-radius: 6px; color: white; cursor: pointer;
            font-size: 12px; white-space: nowrap;
        }
        .actions { display: flex; gap: 8px; margin-top: 16px; }
        .btn {
            flex: 1; padding: 10px; border: none; border-radius: 8px;
            font-size: 13px; font-weight: bold; cursor: pointer; transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-approve { background: #4CAF50; color: white; }
        .btn-reject { background: #F44336; color: white; flex: 0.5; }
        .empty { text-align: center; padding: 60px; opacity: 0.6; font-size: 16px; }
        .loading { text-align: center; padding: 60px; opacity: 0.7; }
        .condition-row { display: flex; gap: 8px; }
        .cond-btn {
            flex: 1; padding: 8px; border: 2px solid #8B949E40;
            border-radius: 8px; background: transparent;
            font-size: 12px; cursor: pointer; transition: all 0.2s; color: #8B949E;
        }
        .cond-btn.good { border-color: #4CAF50; color: #4CAF50; background: #4CAF5020; }
        .cond-btn.fair { border-color: #FFC107; color: #FFC107; background: #FFC10720; }
        .cond-btn.broken { border-color: #F44336; color: #F44336; background: #F4433620; }
    </style>
</head>
<body>
    <h1>PlayOut Admin</h1>
    <p class="subtitle">Review and approve facility proposals</p>
    <div class="stats">
        <div class="stat">
            <div class="stat-number" id="pendingCount">-</div>
            <div class="stat-label">Pending</div>
        </div>
        <div class="stat">
            <div class="stat-number" id="approvedCount">-</div>
            <div class="stat-label">Approved</div>
        </div>
        <div class="stat">
            <div class="stat-number" id="rejectedCount">-</div>
            <div class="stat-label">Rejected</div>
        </div>
    </div>
    <div id="content" class="loading">Loading proposals...</div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
        import { getFirestore, collection, getDocs, doc, updateDoc }
            from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCybtOSVwlmfF0xSQYJXBn00736r7YRzDQ",
            authDomain: "playout-fd72f.firebaseapp.com",
            projectId: "playout-fd72f",
            storageBucket: "playout-fd72f.firebasestorage.app",
            messagingSenderId: "958420111272",
            appId: "1:958420111272:web:060fbf254fff30d0d0579d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // State per card
        const cardState = {};

        async function loadProposals() {
            const content = document.getElementById('content');
            try {
                const snapshot = await getDocs(collection(db, 'proposals'));
                const all = [];
                snapshot.forEach(d => all.push({ id: d.id, ...d.data() }));

                const pending = all.filter(p => p.status === 'pending');
                const approved = all.filter(p => p.status === 'approved');
                const rejected = all.filter(p => p.status === 'rejected');

                document.getElementById('pendingCount').textContent = pending.length;
                document.getElementById('approvedCount').textContent = approved.length;
                document.getElementById('rejectedCount').textContent = rejected.length;

                if (pending.length === 0) {
                    content.innerHTML = '<div class="empty">No pending proposals</div>';
                    return;
                }

                const grid = document.createElement('div');
                grid.className = 'proposals-grid';

                pending.forEach(proposal => {
                    // Init state
                    const photoUrls = proposal.photoUrls || [];

                    cardState[proposal.id] = {
                        sport: proposal.sport || '',
                        description: proposal.description || '',
                        neighbourhood: proposal.neighbourhood || '',
                        condition: proposal.condition || 1,
                        water: proposal.water || 0,
                        seats: proposal.seats || 0,
                        experience: proposal.experience || 0,
                        mainPhotoIndex: 0,
                        photoUrls: photoUrls
                    };

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.id = 'card-' + proposal.id;
                    card.innerHTML = `
                        <div class="photos-scroll" id="photos-${proposal.id}">
                            ${photoUrls.map((url, index) => `
                                <div class="photo-item ${index === 0 ? 'is-main' : ''}"
                                     onclick="setMainPhoto('${proposal.id}', ${index})">
                                    <img src="${url}" onerror="this.style.background='#1C2230'">
                                    ${index === 0 ? '<div class="main-badge">MAIN</div>' : ''}
                                </div>
                            `).join('')}
                        </div>
                        <div class="card-body">
                            <span class="sport-badge">${proposal.sport || 'Unknown'}</span>

                            <div class="field-group">
                                <label>Sport / Category</label>
                                <select onchange="updateState('${proposal.id}', 'sport', this.value)">
                                    ${['Football','Basketball','Pingpong','Volleyball','Chess',
                                       'Fencing','Skating','Calisthenics','Athletics',
                                       'Minigolf','Other'].map(s =>
                                        `<option value="${s}" ${s === proposal.sport ? 'selected' : ''}>${s}</option>`
                                    ).join('')}
                                </select>
                            </div>

                            <div class="field-group">
                                <label>Description</label>
                                <textarea onchange="updateState('${proposal.id}', 'description', this.value)"
                                    >${proposal.description || ''}</textarea>
                            </div>

                            <div class="field-group">
                                <label>Neighbourhood &nbsp;
                                    <a href="https://www.google.com/maps?q=${proposal.latitude},${proposal.longitude}"
                                       target="_blank" style="color:#00AEFF;font-size:11px;">
                                        📍 Open in Maps
                                    </a>
                                </label>
                                <input type="text" value="${proposal.neighbourhood || ''}"
                                    onchange="updateState('${proposal.id}', 'neighbourhood', this.value)"
                                    placeholder="e.g. Westpark">
                            </div>

                            <div class="field-group">
                                <label>Condition</label>
                                <div class="condition-row">
                                    <button class="cond-btn ${proposal.condition === 1 ? 'good' : ''}"
                                        onclick="setCondition('${proposal.id}', 1, this.closest('.condition-row'))">
                                        Good
                                    </button>
                                    <button class="cond-btn ${proposal.condition === 2 ? 'fair' : ''}"
                                        onclick="setCondition('${proposal.id}', 2, this.closest('.condition-row'))">
                                        Fair
                                    </button>
                                    <button class="cond-btn ${proposal.condition === 3 ? 'broken' : ''}"
                                        onclick="setCondition('${proposal.id}', 3, this.closest('.condition-row'))">
                                        Broken
                                    </button>
                                </div>
                            </div>

                            <div class="field-group">
                                <label>Experience (stars)</label>
                                <div class="stars-row" id="stars-${proposal.id}">
                                    ${[1,2,3,4,5].map(n =>
                                        `<button class="star-btn ${n <= (proposal.experience||0) ? 'active' : ''}"
                                            onclick="setStars('${proposal.id}', ${n})">★</button>`
                                    ).join('')}
                                </div>
                            </div>

                            <div class="field-group">
                                <label>Amenities</label>
                                <div class="toggle-row">
                                    <button class="toggle-btn ${proposal.water ? 'active' : ''}"
                                        id="water-${proposal.id}"
                                        onclick="toggleAmenity('${proposal.id}', 'water')">
                                        💧 Water
                                    </button>
                                    <button class="toggle-btn ${proposal.seats ? 'active' : ''}"
                                        id="seats-${proposal.id}"
                                        onclick="toggleAmenity('${proposal.id}', 'seats')">
                                        🪑 Seats
                                    </button>
                                </div>
                            </div>

                            <div class="actions">
                                <button class="btn btn-approve"
                                    onclick="approveWithEdits('${proposal.id}', this)">
                                    ✓ Approve
                                </button>
                                <button class="btn btn-reject"
                                    onclick="updateStatus('${proposal.id}', 'rejected', this)">
                                    ✗ Reject
                                </button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                content.innerHTML = '';
                content.appendChild(grid);
            } catch (e) {
                content.innerHTML = '<div class="empty">Error: ' + e.message + '</div>';
            }
        }

        window.updateState = (id, field, value) => {
            cardState[id][field] = value;
        };

        window.setCondition = (id, value, row) => {
            cardState[id].condition = value;
            row.querySelectorAll('.cond-btn').forEach((btn, i) => {
                btn.className = 'cond-btn';
                if (i + 1 === value) {
                    btn.classList.add(value === 1 ? 'good' : value === 2 ? 'fair' : 'broken');
                }
            });
        };

        window.setStars = (id, value) => {
            cardState[id].experience = value;
            const row = document.getElementById('stars-' + id);
            row.querySelectorAll('.star-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i < value);
            });
        };

        window.toggleAmenity = (id, field) => {
            const current = cardState[id][field];
            cardState[id][field] = current ? 0 : 1;
            const btn = document.getElementById(field + '-' + id);
            btn.classList.toggle('active', cardState[id][field] === 1);
        };

        window.setMainPhoto = (id, index) => {
            cardState[id].mainPhotoIndex = index;
            const container = document.getElementById('photos-' + id);
            container.querySelectorAll('.photo-item').forEach((item, i) => {
                item.classList.toggle('is-main', i === index);
                const badge = item.querySelector('.main-badge');
                if (i === index) {
                    if (!badge) {
                        const b = document.createElement('div');
                        b.className = 'main-badge';
                        b.textContent = 'MAIN';
                        item.appendChild(b);
                    }
                } else {
                    if (badge) badge.remove();
                }
            });
        };

        window.approveWithEdits = async (id, btn) => {
            const actions = btn.parentElement;
            actions.querySelectorAll('button').forEach(b => b.disabled = true);
            try {
                const state = cardState[id];
                const urls = cardState[id].photoUrls;
                const mainIdx = cardState[id].mainPhotoIndex;
                const reorderedUrls = [
                    urls[mainIdx],
                    ...urls.filter((_, i) => i !== mainIdx)
                ];
                await updateDoc(doc(db, 'proposals', id), {
                    status: 'approved',
                    sport: state.sport,
                    description: state.description,
                    neighbourhood: state.neighbourhood,
                    condition: state.condition,
                    water: state.water,
                    seats: state.seats,
                    experience: state.experience,
                    photoUrls: reorderedUrls
                });
                btn.textContent = '✓ Approved!';
                setTimeout(() => loadProposals(), 1200);
            } catch (e) {
                actions.querySelectorAll('button').forEach(b => b.disabled = false);
                alert('Error: ' + e.message);
            }
        };

        window.updateStatus = async (id, status, btn) => {
            const actions = btn.parentElement;
            actions.querySelectorAll('button').forEach(b => b.disabled = true);
            try {
                await updateDoc(doc(db, 'proposals', id), { status });
                btn.textContent = '✗ Rejected';
                setTimeout(() => loadProposals(), 1200);
            } catch (e) {
                actions.querySelectorAll('button').forEach(b => b.disabled = false);
                alert('Error: ' + e.message);
            }
        };

        loadProposals();
    </script>
</body>
</html>
