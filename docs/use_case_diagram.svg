<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760">
  <rect width="900" height="760" fill="white"/>
  <!-- System boundary -->
  <rect x="280" y="40" width="520" height="680" rx="14" fill="none" stroke="#806B40" stroke-width="2"/>
  <text x="540" y="68" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#2C332D">PlayOut System</text>

  <!-- Visitor actor -->
  <g stroke="#2C332D" stroke-width="2" fill="none">
    <circle cx="90" cy="150" r="14"/>
    <line x1="90" y1="164" x2="90" y2="200"/>
    <line x1="68" y1="176" x2="112" y2="176"/>
    <line x1="90" y1="200" x2="72" y2="226"/>
    <line x1="90" y1="200" x2="108" y2="226"/>
  </g>
  <text x="90" y="250" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#2C332D">Visitor</text>

  <!-- Registered user actor -->
  <g stroke="#2C332D" stroke-width="2" fill="none">
    <circle cx="90" cy="410" r="14"/>
    <line x1="90" y1="424" x2="90" y2="460"/>
    <line x1="68" y1="436" x2="112" y2="436"/>
    <line x1="90" y1="460" x2="72" y2="486"/>
    <line x1="90" y1="460" x2="108" y2="486"/>
  </g>
  <text x="90" y="510" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#2C332D">Registered user</text>

  <!-- Administrator actor -->
  <g stroke="#2C332D" stroke-width="2" fill="none">
    <circle cx="90" cy="650" r="14"/>
    <line x1="90" y1="664" x2="90" y2="700"/>
    <line x1="68" y1="676" x2="112" y2="676"/>
    <line x1="90" y1="700" x2="72" y2="726"/>
    <line x1="90" y1="700" x2="108" y2="726"/>
  </g>
  <text x="90" y="748" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#2C332D">Administrator</text>

  <!-- Inheritance arrow -->
  <line x1="90" y1="390" x2="90" y2="270" stroke="#2C332D" stroke-width="1.5" marker-end="url(#hollow)"/>
  <text x="105" y="330" font-family="Arial" font-size="12" fill="#2C332D" font-style="italic">«inherits»</text>
  <defs>
    <marker id="hollow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="white" stroke="#2C332D" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Visitor use cases (blue) -->
  <g font-family="Arial" font-size="12">
    <ellipse cx="410" cy="110" rx="105" ry="20" fill="#E6F1FB" stroke="#185FA5"/>
    <text x="410" y="114" text-anchor="middle" fill="#042C53">UC1 Locate by sport</text>
    <ellipse cx="410" cy="160" rx="105" ry="20" fill="#E6F1FB" stroke="#185FA5"/>
    <text x="410" y="164" text-anchor="middle" fill="#042C53">UC2 Check photos</text>
    <ellipse cx="410" cy="210" rx="105" ry="20" fill="#E6F1FB" stroke="#185FA5"/>
    <text x="410" y="214" text-anchor="middle" fill="#042C53">UC3 Assess condition</text>
    <ellipse cx="650" cy="135" rx="105" ry="20" fill="#E6F1FB" stroke="#185FA5"/>
    <text x="650" y="139" text-anchor="middle" fill="#042C53">UC4 Discover nearby</text>
    <ellipse cx="650" cy="185" rx="105" ry="20" fill="#E6F1FB" stroke="#185FA5"/>
    <text x="650" y="189" text-anchor="middle" fill="#042C53">UC5 Find seating</text>
    <ellipse cx="650" cy="235" rx="105" ry="20" fill="#E6F1FB" stroke="#185FA5"/>
    <text x="650" y="239" text-anchor="middle" fill="#042C53">UC6 Navigate (Maps)</text>
  </g>

  <!-- Registered use cases (teal) -->
  <g font-family="Arial" font-size="12">
    <ellipse cx="410" cy="370" rx="105" ry="20" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="410" y="374" text-anchor="middle" fill="#04342C">UC7 Register / verify</text>
    <ellipse cx="410" cy="420" rx="105" ry="20" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="410" y="424" text-anchor="middle" fill="#04342C">UC8 Log in</text>
    <ellipse cx="410" cy="470" rx="105" ry="20" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="410" y="474" text-anchor="middle" fill="#04342C">UC9 Propose facility</text>
    <ellipse cx="650" cy="395" rx="105" ry="20" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="650" y="399" text-anchor="middle" fill="#04342C">UC10 Review facility</text>
    <ellipse cx="650" cy="445" rx="105" ry="20" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="650" y="449" text-anchor="middle" fill="#04342C">UC11 Edit/delete review</text>
    <ellipse cx="650" cy="495" rx="105" ry="20" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="650" y="499" text-anchor="middle" fill="#04342C">UC12 Manage own</text>
  </g>

  <!-- Admin use cases (amber) -->
  <g font-family="Arial" font-size="12">
    <ellipse cx="520" cy="630" rx="115" ry="20" fill="#FAEEDA" stroke="#854F0B"/>
    <text x="520" y="634" text-anchor="middle" fill="#412402">UC13 Review proposals</text>
    <ellipse cx="520" cy="680" rx="115" ry="20" fill="#FAEEDA" stroke="#854F0B"/>
    <text x="520" y="684" text-anchor="middle" fill="#412402">UC14 Moderate reviews</text>
  </g>

  <!-- Visitor connectors -->
  <g stroke="#888780" stroke-width="1">
    <line x1="112" y1="165" x2="305" y2="115"/>
    <line x1="112" y1="168" x2="305" y2="160"/>
    <line x1="112" y1="171" x2="305" y2="205"/>
    <line x1="112" y1="165" x2="545" y2="138"/>
    <line x1="112" y1="168" x2="545" y2="185"/>
    <line x1="112" y1="171" x2="545" y2="232"/>
  </g>

  <!-- Registered connectors -->
  <g stroke="#888780" stroke-width="1">
    <line x1="112" y1="425" x2="305" y2="370"/>
    <line x1="112" y1="428" x2="305" y2="420"/>
    <line x1="112" y1="431" x2="305" y2="468"/>
    <line x1="112" y1="425" x2="545" y2="395"/>
    <line x1="112" y1="428" x2="545" y2="443"/>
    <line x1="112" y1="431" x2="545" y2="493"/>
  </g>

  <!-- Admin connectors -->
  <g stroke="#888780" stroke-width="1">
    <line x1="112" y1="665" x2="405" y2="630"/>
    <line x1="112" y1="668" x2="405" y2="678"/>
  </g>
</svg>
